# Kairos and its Postgres. Put GRAYSON_API_KEY in .env (see .env.example), then:
#
#   docker compose up --build
#
# The console and the API are on http://localhost:8787. The API runs the background jobs itself.
# To run them in a worker container of their own instead:
#
#   KAIROS_WORKER=separate docker compose --profile worker up --build

x-kairos-environment: &kairos-environment
  DATABASE_URL: postgres://kairos:${POSTGRES_PASSWORD:-kairos}@postgres:5432/kairos
  GRAYSON_API_KEY: ${GRAYSON_API_KEY:?Set GRAYSON_API_KEY in .env. See .env.example.}
  KAIROS_SIGNUP: ${KAIROS_SIGNUP:-}
  KAIROS_TRUST_PROXY: ${KAIROS_TRUST_PROXY:-}
  KAIROS_WORKER: ${KAIROS_WORKER:-}
  # Webhooks need it. Keep it: the signing secrets cannot be read with another key.
  KAIROS_ENCRYPTION_KEY: ${KAIROS_ENCRYPTION_KEY:-}
  CRON_SECRET: ${CRON_SECRET:-}
  KAIROS_WEBHOOK_PAYLOAD_DAYS: ${KAIROS_WEBHOOK_PAYLOAD_DAYS:-}
  # An HTTP step reads secrets.NAME from KAIROS_SECRET_NAME: add each one here.
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_PROVIDERS: ${SUPABASE_PROVIDERS:-}

services:
  kairos:
    build: .
    ports:
      - "${PORT:-8787}:8787"
    environment: *kairos-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The background jobs, with KAIROS_WORKER=separate. Scale it with --scale worker=N.
  worker:
    build: .
    profiles: [worker]
    command: ["node", "worker.mjs"]
    environment: *kairos-environment
    # The image's check calls /health, and the worker serves no HTTP.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The migrate step: brings the database up to date and stops. Kairos starts after it.
  migrate:
    build: .
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://kairos:${POSTGRES_PASSWORD:-kairos}@postgres:5432/kairos
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: kairos
    volumes:
      - kairos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  kairos-postgres:
