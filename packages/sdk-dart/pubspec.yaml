name: finic_kairos
description: >-
  Kairos client for Flutter apps. Gives each install a device id and sends app events and
  screen views to Kairos with a public key, for real-time fraud and risk decisions.
version: 0.1.0
homepage: https://kairos.finic.ai
repository: https://github.com/finic-ai/kairos/tree/main/packages/sdk-dart
documentation: https://kairos.finic.ai/docs/reference/clients/dart

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ">=10.1.0 <13.0.0"
  http: ^1.2.0
  package_info_plus: ">=8.0.0 <10.0.0"
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
